name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile-app/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'mobile-app/**'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4

    - name: Install Android SDK components
      run: |
        echo "ANDROID_HOME=$ANDROID_HOME"
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;25.1.8937393"

    - name: Generate debug keystore
      run: |
        keytool -genkeypair -v -keystore mobile-app/android/app/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.3'

    - name: Install dependencies
      working-directory: ./mobile-app
      run: |
        rm -rf node_modules package-lock.json
        npm install

    - name: Generate Gradle wrapper
      working-directory: ./mobile-app/android
      run: |
        chmod +x gradlew 2>/dev/null || true
        gradle wrapper --gradle-version 8.3

    - name: Build Android APK
      working-directory: ./mobile-app/android
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease --no-daemon --stacktrace --info

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: JARVIS-Mobile-APK
        path: mobile-app/android/app/build/outputs/apk/release/app-release.apk
        retention-days: 30

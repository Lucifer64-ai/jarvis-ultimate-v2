name: Build JARVIS Installer

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~\AppData\Local\pip\Cache
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install pyinstaller
        pip install -r requirements.txt
        pip install python-dotenv
        pip install pywin32 || echo "pywin32 install failed, skipping"
        pip install pycaw || echo "pycaw install failed, skipping"
        pip install WMI || echo "WMI install failed, skipping"
        pip install pyaudio --only-binary :all: || pip install pyaudio || echo "PyAudio install failed, skipping"
      shell: pwsh
      continue-on-error: true

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller jarvis.spec
      shell: pwsh

    - name: Prepare installer package
      run: |
        # ¡¾·´°¼ ¿°¿º ´» °½¾²¸º°
        New-Item -ItemType Directory -Force -Path installer\package | Out-Null

        # ¾¿¸µ¼ EXE
        if (Test-Path "dist\JARVIS.exe") {
          Copy-Item dist\JARVIS.exe installer\package\JARVIS.exe -Force
          Write-Host "EXE copied"
        } elseif (Test-Path "dist\JARVIS\JARVIS.exe") {
          Copy-Item dist\JARVIS\JARVIS.exe installer\package\JARVIS.exe -Force
          Write-Host "EXE copied from dist/JARVIS"
        }

        # ¾¿¸µ¼ ²µ ¿°¿º¸ ¿¾µº°
        $folders = @('ai', 'core', 'modules', 'voice', 'ui', 'smart_home', 'automation', 'hardware', 'hud', 'mobile', 'scripts', 'assets')
        foreach ($folder in $folders) {
          if (Test-Path $folder) {
            Copy-Item -Recurse -Force $folder installer\package\$folder
            Write-Host "Copied $folder"
          }
        }

        # ¾¿¸µ¼ º¾½¸³¸ ¸ ´¾º¼µ½°¸
        if (Test-Path "config.json") { Copy-Item config.json installer\package\ }
        if (Test-Path ".env.example") { Copy-Item .env.example installer\package\.env }
        if (Test-Path "requirements.txt") { Copy-Item requirements.txt installer\package\ }
        if (Test-Path "README.md") { Copy-Item README.md installer\package\ }
        if (Test-Path "LICENSE") { Copy-Item LICENSE installer\package\ }

        Write-Host "Package prepared"
        Get-ChildItem installer\package -Recurse | Measure-Object | Select-Object -ExpandProperty Count
      shell: pwsh

    - name: Upload package artifact
      uses: actions/upload-artifact@v4
      with:
        name: JARVIS-Package
        path: installer/package/
        retention-days: 30

    - name: Build Installer with Inno Setup
      run: |
        # £°½°²»¸²°µ¼ Inno Setup
        choco install innosetup -y --no-progress
        Write-Host "Inno Setup installed"

        # ¡¾±¸°µ¼ °½¾²¸º
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\jarvis_installer.iss
        Write-Host "Installer built"

        # ¾²µµ¼ µ·»°
        if (Test-Path "installer\output\*.exe") {
          Write-Host "Installer created successfully"
          Get-ChildItem installer\output\*.exe | ForEach-Object { Write-Host "  $($_.Name) - $([math]::Round($_.Length / 1MB, 2)) MB" }
        } else {
          Write-Error "Installer not created"
        }
      shell: pwsh

    - name: Upload Installer
      uses: actions/upload-artifact@v4
      with:
        name: JARVIS-Installer
        path: installer/output/JARVIS_Ultimate_Setup_*.exe
        retention-days: 30

    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: installer/output/JARVIS_Ultimate_Setup_*.exe
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
